{% extends "base.html" %}
{% block content %}
<details class="panel" id="prompt-panel">
  <summary><i data-lucide="chevron-right" class="chev"></i>시스템 프롬프트</summary>
  <div class="panel-body">
    <textarea id="prompt-text" rows="6" aria-label="시스템 프롬프트"></textarea>
    <div class="row end">
      <button id="prompt-save" class="btn"><i data-lucide="save"></i>저장</button>
    </div>
  </div>
</details>

<section class="panel">
  <div class="panel-body">
    <div class="segmented" role="tablist" id="mode">
      <button role="tab" data-mode="single" class="active">개별 입력</button>
      <button role="tab" data-mode="bulk">벌크 입력</button>
    </div>
    <textarea id="question" rows="4" aria-label="질문"></textarea>
    <div class="row wrap between">
      <div id="providers" class="checks" aria-label="Provider"></div>
      <button id="submit" class="btn primary"><i data-lucide="send"></i><span id="submit-label">질의하기</span></button>
    </div>
  </div>
</section>

<section class="panel">
  <table class="list">
    <thead>
      <tr><th>Query ID</th><th>Batch</th><th>질문</th><th>Provider별 상태</th><th>등록일시</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>등록된 질의가 없습니다</div>
  <div class="row center"><button id="more" class="btn" hidden>더 보기</button></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ base }}/static/index.js"></script>{% endblock %}
