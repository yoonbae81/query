{% extends "base.html" %}
{% block title %}{{ query_id }} · Query{% endblock %}
{% block content %}
<div class="row"><a href="{{ base }}/" class="btn ghost"><i data-lucide="arrow-left"></i>목록</a></div>

<section class="panel" id="header" data-query-id="{{ query_id }}">
  <div class="panel-body">
    <div class="meta"><strong id="q-id">{{ query_id }}</strong><span id="q-created"></span></div>
    <p id="q-text" class="question"></p>
  </div>
</section>

<section class="panel">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel-body" id="panel"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ base }}/static/detail.js"></script>{% endblock %}
